<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#111827">

  <title>Whisper Transcriber</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f7;
      color: #111827;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 30px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    input[type="url"] {
      width: 100%;
      padding: 15px;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      background: #fafafa;
      font-size: 16px;
      outline: none;
    }

    input[type="url"]:focus {
      border-color: #111827;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 15px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 12px;
    }

    #transcribeBtn {
      background: #111827;
      color: white;
    }

    #transcribeBtn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #copyBtn {
      background: #e5e7eb;
      color: #111827;
    }

    #status {
      text-align: center;
      margin: 20px 0;
      color: #6b7280;
      line-height: 1.5;
    }

    #result {
      width: 100%;
      min-height: 250px;
      margin-top: 15px;
      padding: 15px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      resize: vertical;
      font-size: 16px;
      line-height: 1.6;
      font-family: inherit;
    }

    .hidden {
      display: none;
    }

    .hint {
      margin-top: 10px;
      font-size: 13px;
      color: #9ca3af;
    }
  </style>

</head>

<body>

  <div class="container">

```
<h1>🎙️ Whisper Transcriber</h1>

<div class="subtitle">
  Transcribe TikTok videos with Whisper
</div>

<div class="card">

  <input
    type="url"
    id="tiktokUrl"
    placeholder="Paste TikTok link here..."
    autocomplete="off"
  >

  <div class="hint">
    Example: https://www.tiktok.com/@user/video/...
  </div>

  <button id="transcribeBtn">
    🎙️ Transcribe
  </button>

  <div id="status"></div>

  <textarea
    id="result"
    class="hidden"
    placeholder="Your transcription will appear here..."
    readonly
  ></textarea>

  <button
    id="copyBtn"
    class="hidden"
  >
    📋 Copy transcription
  </button>

</div>
```

  </div>

<script>

const API_URL =
  "https://whisper-api.fly.dev/tiktok";

const tiktokUrl =
  document.getElementById("tiktokUrl");

const transcribeBtn =
  document.getElementById("transcribeBtn");

const result =
  document.getElementById("result");

const status =
  document.getElementById("status");

const copyBtn =
  document.getElementById("copyBtn");


tiktokUrl.addEventListener("input", () => {

  const url = tiktokUrl.value.trim();

  transcribeBtn.disabled = !url;

  if (!url) {
    status.textContent = "";
    result.classList.add("hidden");
    copyBtn.classList.add("hidden");
  }

});


transcribeBtn.addEventListener("click", async () => {

  const url = tiktokUrl.value.trim();

  if (!url) {
    status.textContent =
      "⚠️ Please paste a TikTok URL.";

    return;
  }

  if (
    !url.includes("tiktok.com") &&
    !url.includes("vm.tiktok.com")
  ) {
    status.textContent =
      "⚠️ Please enter a valid TikTok URL.";

    return;
  }

  transcribeBtn.disabled = true;

  result.classList.add("hidden");
  copyBtn.classList.add("hidden");

  status.textContent =
    "⏳ Downloading TikTok video...";

  try {

    const response = await fetch(API_URL, {
      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        url: url
      })
    });

    let data;

    try {
      data = await response.json();
    } catch {
      throw new Error(
        `Server error: ${response.status}`
      );
    }

    if (!response.ok) {

      throw new Error(
        data.detail ||
        `Server error: ${response.status}`
      );

    }

    if (!data.text) {

      throw new Error(
        "No transcription returned."
      );

    }

    result.value = data.text;

    result.classList.remove("hidden");
    copyBtn.classList.remove("hidden");

    status.textContent =
      `✅ Transcription completed` +
      (data.language
        ? ` • Language: ${data.language}`
        : "");

  } catch (error) {

    console.error(error);

    status.textContent =
      "❌ Error: " + error.message;

  } finally {

    transcribeBtn.disabled = false;

  }

});


copyBtn.addEventListener("click", async () => {

  try {

    await navigator.clipboard.writeText(
      result.value
    );

    copyBtn.textContent =
      "✅ Copied!";

    setTimeout(() => {

      copyBtn.textContent =
        "📋 Copy transcription";

    }, 2000);

  } catch (error) {

    result.select();

    document.execCommand("copy");

    copyBtn.textContent =
      "✅ Copied!";

  }

});

</script>

</body>
</html>
